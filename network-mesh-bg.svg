<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="net-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="40%" stop-color="#070c1a"/>
      <stop offset="70%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#050813"/>
    </linearGradient>

    <!-- Fiber Optical Conduits Gradients -->
    <linearGradient id="fiber-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="fiber-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="fiber-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-core" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Micro Grid Pattern -->
    <pattern id="telemetry-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1" />
      <circle cx="60" cy="0" r="1" fill="rgba(56, 189, 248, 0.12)" />
      <circle cx="0" cy="60" r="1" fill="rgba(56, 189, 248, 0.12)" />
      <!-- Subtle secondary crosshair -->
      <path d="M 28 30 L 32 30 M 30 28 L 30 32" stroke="rgba(56, 189, 248, 0.06)" stroke-width="0.75" />
    </pattern>

    <!-- Hexagonal Mesh Grid Pattern -->
    <pattern id="hex-mesh" width="120" height="104" patternUnits="userSpaceOnUse" patternTransform="scale(1.2)">
      <path d="M 30,0 L 90,0 L 120,52 L 90,104 L 30,104 L 0,52 Z" fill="none" stroke="rgba(30, 58, 138, 0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1920" height="1080" fill="url(#net-bg)" />

  <!-- Background Ambient Hex & Orthogonal Grids -->
  <rect width="1920" height="1080" fill="url(#hex-mesh)" opacity="0.65" />
  <rect width="1920" height="1080" fill="url(#telemetry-grid)" />

  <!-- Ambient Network Depth Radial Blooms -->
  <circle cx="280" cy="220" r="320" fill="#0284c7" opacity="0.07" filter="url(#glow-core)" />
  <circle cx="1640" cy="480" r="420" fill="#1d4ed8" opacity="0.08" filter="url(#glow-core)" />
  <circle cx="960" cy="920" r="380" fill="#0f766e" opacity="0.06" filter="url(#glow-core)" />
  <circle cx="1180" cy="180" r="260" fill="#0284c7" opacity="0.05" filter="url(#glow-core)" />

  <!-- =========================================================================
       TIER 1: CORE ENTERPRISE SPINE & LEAF DATA PLANE TOPOLOGY
       ========================================================================= -->

  <!-- Major Backbone Conduits (High Speed SDN Optical Links) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- North-South Optical Arteries -->
    <path d="M 140,-50 L 140,320 L 380,480 L 380,820 L 520,960 L 520,1150" fill="none" stroke="url(#fiber-cyan)" stroke-width="2" />
    <path d="M 140,320 L 680,320 L 960,520 L 1380,520 L 1620,700 L 1880,700" fill="none" stroke="url(#fiber-cyan)" stroke-width="2.5" />
    <path d="M 680,-50 L 680,320 L 960,320 L 1180,180 L 1640,180 L 1950,180" fill="none" stroke="url(#fiber-blue)" stroke-width="2" />
    <path d="M 960,520 L 960,940 L 1260,940 L 1480,1150" fill="none" stroke="url(#fiber-blue)" stroke-width="2.2" />

    <!-- Cross-Network Routing Interconnects -->
    <path d="M 380,480 L 680,480 L 820,380 L 1180,380 L 1380,520" fill="none" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1.2" stroke-dasharray="6,4" />
    <path d="M 680,320 L 680,780 L 960,780 L 1120,680 L 1380,680 L 1620,700" fill="none" stroke="rgba(37, 99, 235, 0.25)" stroke-width="1.2" stroke-dasharray="8,5" />
    <path d="M 380,820 L 680,820 L 960,940" fill="none" stroke="url(#fiber-emerald)" stroke-width="1.8" />
    
    <!-- East Edge Ingress / Egress Highway -->
    <path d="M 1640,-50 L 1640,180 L 1780,280 L 1780,620 L 1620,700 L 1620,1150" fill="none" stroke="url(#fiber-cyan)" stroke-width="2" />
    <path d="M 1180,180 L 1180,380 L 1380,520 L 1380,880 L 1620,880" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />

    <!-- Secondary Edge Links -->
    <path d="M -50,620 L 180,620 L 380,480" fill="none" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.2" />
    <path d="M -50,880 L 220,880 L 380,820" fill="none" stroke="rgba(14, 165, 233, 0.2)" stroke-width="1" />
    <path d="M 820,380 L 960,240 L 1180,240 L 1180,180" fill="none" stroke="rgba(37, 99, 235, 0.2)" stroke-width="1" />
    <path d="M 1380,680 L 1520,680 L 1640,580 L 1950,580" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.2" />
    <path d="M 1120,680 L 1120,940" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.2" stroke-dasharray="4,4" />
  </g>

  <!-- =========================================================================
       TIER 2: ENTERPRISE ROUTER & SWITCH NODES (BGP / SDN CONTROLLER / GATEWAYS)
       ========================================================================= -->

  <!-- CORE ROUTER 1: Primary West Ingress (380, 480) -->
  <g transform="translate(380, 480)">
    <circle r="26" fill="rgba(2, 132, 199, 0.15)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    <circle r="14" fill="#071228" stroke="#00f2fe" stroke-width="2" filter="url(#glow-cyan)" />
    <circle r="5" fill="#38bdf8" />
    <rect x="-38" y="-38" width="76" height="76" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" stroke-dasharray="4,4" />
    <text x="32" y="-12" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">CORE-RTR-01</text>
    <text x="32" y="4" fill="rgba(148, 163, 184, 0.7)" font-family="'JetBrains Mono', monospace" font-size="8">100G FIBER · BGP-AS65001</text>
  </g>

  <!-- CORE ROUTER 2: Central SDN Spine Controller (960, 520) -->
  <g transform="translate(960, 520)">
    <circle r="36" fill="rgba(14, 165, 233, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" />
    <circle r="20" fill="#061329" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow-cyan)" />
    <circle r="8" fill="#00f2fe" />
    <polygon points="0,-46 46,0 0,46 -46,0" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <text x="44" y="-14" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">SDN-SPINE-ROOT</text>
    <text x="44" y="2" fill="rgba(203, 213, 225, 0.8)" font-family="'JetBrains Mono', monospace" font-size="8.5">400G TERABIT FABRIC · ACTIVE</text>
    <text x="44" y="16" fill="rgba(52, 211, 153, 0.9)" font-family="'JetBrains Mono', monospace" font-size="8">PACKET LOSS: 0.000% · MTU: 9216</text>
  </g>

  <!-- CORE ROUTER 3: East Data Hub (1620, 700) -->
  <g transform="translate(1620, 700)">
    <circle r="28" fill="rgba(37, 99, 235, 0.18)" stroke="rgba(96, 165, 250, 0.35)" stroke-width="1.5" />
    <circle r="15" fill="#08142c" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" />
    <circle r="6" fill="#60a5fa" />
    <rect x="-35" y="-35" width="70" height="70" fill="none" stroke="rgba(96, 165, 250, 0.2)" stroke-width="1" stroke-dasharray="3,3" />
    <text x="-165" y="-10" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">EDGE-GW-EAST</text>
    <text x="-165" y="6" fill="rgba(148, 163, 184, 0.7)" font-family="'JetBrains Mono', monospace" font-size="8">VLAN 100-400 · OSPF AREA 0</text>
  </g>

  <!-- DISTRIBUTION SWITCH 1: (680, 320) -->
  <g transform="translate(680, 320)">
    <circle r="16" fill="#08162e" stroke="#38bdf8" stroke-width="1.8" />
    <circle r="5" fill="#00f2fe" />
    <text x="22" y="-6" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">DIST-SW-A1</text>
    <text x="22" y="8" fill="rgba(148, 163, 184, 0.6)" font-family="'JetBrains Mono', monospace" font-size="7.5">10GbE TRUNK</text>
  </g>

  <!-- DISTRIBUTION SWITCH 2: (1380, 520) -->
  <g transform="translate(1380, 520)">
    <circle r="18" fill="#08162e" stroke="#60a5fa" stroke-width="1.8" />
    <circle r="6" fill="#38bdf8" />
    <text x="24" y="-8" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">LEAF-SW-B4</text>
    <text x="24" y="6" fill="rgba(148, 163, 184, 0.6)" font-family="'JetBrains Mono', monospace" font-size="7.5">VXLAN VTEP #104</text>
  </g>

  <!-- BMS/IOT GATEWAY (380, 820) -->
  <g transform="translate(380, 820)">
    <circle r="18" fill="#061f18" stroke="#10b981" stroke-width="1.8" />
    <circle r="5" fill="#34d399" />
    <text x="24" y="-6" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">BMS-BACNET-GW</text>
    <text x="24" y="8" fill="rgba(110, 231, 183, 0.7)" font-family="'JetBrains Mono', monospace" font-size="7.5">MODBUS / IP TELEMETRY</text>
  </g>

  <!-- DATACENTER APPLIANCE NODE (1180, 180) -->
  <g transform="translate(1180, 180)">
    <circle r="15" fill="#0a1835" stroke="#38bdf8" stroke-width="1.5" />
    <circle r="4" fill="#00f2fe" />
    <text x="20" y="-4" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="8.5">API-CLUSTER-INGRESS</text>
  </g>

  <!-- CLOUD STORAGE CLUSTER (960, 940) -->
  <g transform="translate(960, 940)">
    <circle r="16" fill="#061c28" stroke="#0ea5e9" stroke-width="1.5" />
    <circle r="4" fill="#38bdf8" />
    <text x="22" y="-4" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5">DISTRIBUTED-STORAGE-POD</text>
  </g>

  <!-- Ingress Gateway (140, 320) -->
  <g transform="translate(140, 320)">
    <circle r="12" fill="#071328" stroke="#38bdf8" stroke-width="1.5" />
    <circle r="3.5" fill="#00f2fe" />
    <text x="18" y="-2" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">BORDER-PEER-01</text>
  </g>

  <!-- Aggregation Node (1640, 180) -->
  <g transform="translate(1640, 180)">
    <circle r="14" fill="#091730" stroke="#60a5fa" stroke-width="1.5" />
    <circle r="4" fill="#93c5fd" />
    <text x="-125" y="-4" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">WAN-AGGREGATOR-2</text>
  </g>

  <!-- Node (1780, 280) -->
  <g transform="translate(1780, 280)">
    <circle r="8" fill="#071328" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Node (680, 780) -->
  <g transform="translate(680, 780)">
    <circle r="10" fill="#071828" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Node (1120, 680) -->
  <g transform="translate(1120, 680)">
    <circle r="9" fill="#071328" stroke="#10b981" stroke-width="1" />
  </g>

  <!-- Node (1380, 880) -->
  <g transform="translate(1380, 880)">
    <circle r="9" fill="#071328" stroke="#60a5fa" stroke-width="1" />
  </g>

  <!-- =========================================================================
       TIER 3: DATACENTER SERVER RACK & SWITCH PORT VISUALIZATIONS
       ========================================================= -->

  <!-- Left Server Rack Blade Visual (90, 720) -->
  <g transform="translate(80, 700)" opacity="0.35">
    <rect width="180" height="220" rx="6" fill="#060d1d" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <line x1="0" y1="36" x2="180" y2="36" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />
    <line x1="0" y1="72" x2="180" y2="72" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />
    <line x1="0" y1="108" x2="180" y2="108" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />
    <line x1="0" y1="144" x2="180" y2="144" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />
    <line x1="0" y1="180" x2="180" y2="180" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />
    <!-- Telemetry LEDs -->
    <circle cx="20" cy="18" r="2.5" fill="#34d399" />
    <circle cx="32" cy="18" r="2.5" fill="#38bdf8" />
    <circle cx="44" cy="18" r="2.5" fill="#34d399" />
    <circle cx="56" cy="18" r="2.5" fill="#38bdf8" />
    <rect x="75" y="14" width="85" height="8" rx="2" fill="rgba(56, 189, 248, 0.1)" />
    
    <circle cx="20" cy="54" r="2.5" fill="#34d399" />
    <circle cx="32" cy="54" r="2.5" fill="#34d399" />
    <circle cx="44" cy="54" r="2.5" fill="#38bdf8" />
    <rect x="75" y="50" width="85" height="8" rx="2" fill="rgba(56, 189, 248, 0.1)" />

    <circle cx="20" cy="90" r="2.5" fill="#34d399" />
    <circle cx="32" cy="90" r="2.5" fill="#38bdf8" />
    <rect x="75" y="86" width="85" height="8" rx="2" fill="rgba(56, 189, 248, 0.1)" />

    <text x="12" y="206" fill="rgba(148, 163, 184, 0.6)" font-family="'JetBrains Mono', monospace" font-size="8">RACK-04 // 42U INFRASTRUCTURE</text>
  </g>

  <!-- Right Server Rack Blade Visual (1680, 800) -->
  <g transform="translate(1660, 780)" opacity="0.32">
    <rect width="190" height="190" rx="6" fill="#060d1d" stroke="rgba(37, 99, 235, 0.25)" stroke-width="1" />
    <line x1="0" y1="32" x2="190" y2="32" stroke="rgba(37, 99, 235, 0.15)" stroke-width="1" />
    <line x1="0" y1="64" x2="190" y2="64" stroke="rgba(37, 99, 235, 0.15)" stroke-width="1" />
    <line x1="0" y1="96" x2="190" y2="96" stroke="rgba(37, 99, 235, 0.15)" stroke-width="1" />
    <line x1="0" y1="128" x2="190" y2="128" stroke="rgba(37, 99, 235, 0.15)" stroke-width="1" />
    <!-- Switch ports -->
    <rect x="15" y="10" width="12" height="12" rx="2" fill="#0f1f3d" stroke="#38bdf8" stroke-width="0.8" />
    <rect x="32" y="10" width="12" height="12" rx="2" fill="#0f1f3d" stroke="#38bdf8" stroke-width="0.8" />
    <rect x="49" y="10" width="12" height="12" rx="2" fill="#0f1f3d" stroke="#38bdf8" stroke-width="0.8" />
    <rect x="66" y="10" width="12" height="12" rx="2" fill="#0f1f3d" stroke="#38bdf8" stroke-width="0.8" />
    <rect x="83" y="10" width="12" height="12" rx="2" fill="#0f1f3d" stroke="#38bdf8" stroke-width="0.8" />
    <rect x="100" y="10" width="12" height="12" rx="2" fill="#0f1f3d" stroke="#38bdf8" stroke-width="0.8" />
    <text x="12" y="172" fill="rgba(148, 163, 184, 0.6)" font-family="'JetBrains Mono', monospace" font-size="8">TOR SWITCH // 48x25G + 6x100G</text>
  </g>

  <!-- =========================================================================
       TIER 4: IN-FLIGHT DATA PACKETS & TELEMETRY STREAM PARTICLES
       ========================================================================= -->
  <g>
    <!-- Cyan luminous packets moving along arteries -->
    <circle cx="260" cy="320" r="3.5" fill="#00f2fe" filter="url(#glow-cyan)" />
    <circle cx="500" cy="320" r="3" fill="#38bdf8" filter="url(#glow-cyan)" />
    <circle cx="820" cy="420" r="3.5" fill="#00f2fe" filter="url(#glow-cyan)" />
    <circle cx="1180" cy="520" r="4" fill="#00f2fe" filter="url(#glow-cyan)" />
    <circle cx="1500" cy="610" r="3.5" fill="#38bdf8" filter="url(#glow-cyan)" />

    <!-- Blue and emerald packets -->
    <circle cx="380" cy="650" r="3" fill="#34d399" />
    <circle cx="530" cy="820" r="3.5" fill="#10b981" />
    <circle cx="1620" cy="950" r="3" fill="#60a5fa" />
    <circle cx="140" cy="180" r="2.5" fill="#38bdf8" />
    <circle cx="960" cy="730" r="3.5" fill="#0284c7" />
  </g>

  <!-- Optical Vignette Frame -->
  <rect width="1920" height="1080" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" />
</svg>
