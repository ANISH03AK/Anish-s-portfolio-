<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background & Canvas Gradients -->
    <radialGradient id="spaceCore" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#090d16" />
      <stop offset="85%" stop-color="#04060a" />
      <stop offset="100%" stop-color="#010204" />
    </radialGradient>

    <!-- Holographic Cyan/Indigo Cyber Beams -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="cyberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="cyberRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="titaniumSheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#94a3b8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="25" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Conic-like Radial Arc Gradient -->
    <radialGradient id="centerBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Space Canvas -->
  <rect width="800" height="800" fill="url(#spaceCore)" />

  <!-- Ambient Light Burst -->
  <circle cx="400" cy="400" r="380" fill="url(#centerBurst)" />

  <!-- Circular Precision Telemetry Grid Lines -->
  <g opacity="0.4">
    <circle cx="400" cy="400" r="370" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="8 12" />
    <circle cx="400" cy="400" r="350" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="2 6" />
    <circle cx="400" cy="400" r="310" fill="none" stroke="#334155" stroke-width="1" />
    <circle cx="400" cy="400" r="260" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="16 8" />
    <circle cx="400" cy="400" r="190" fill="none" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.6" />
  </g>

  <!-- High-Tech Hexagonal Energy Shield Outer Lattice -->
  <g transform="translate(400, 400)" opacity="0.85">
    <!-- Outer Hexagon Ring -->
    <polygon points="
      0,-330 285.7,-165 285.7,165 0,330 -285.7,165 -285.7,-165" 
      fill="none" stroke="url(#cyberCyan)" stroke-width="3" filter="url(#intenseGlow)" />

    <!-- Secondary Inset Hexagon -->
    <polygon points="
      0,-305 264.1,-152.5 264.1,152.5 0,305 -264.1,152.5 -264.1,-152.5" 
      fill="none" stroke="url(#cyberGold)" stroke-width="1.5" stroke-dasharray="40 18 10 18" opacity="0.75" />

    <!-- Corner Node Precision Anchors -->
    <circle cx="0" cy="-330" r="7" fill="#38bdf8" filter="url(#neonBloom)" />
    <circle cx="285.7" cy="-165" r="7" fill="#38bdf8" filter="url(#neonBloom)" />
    <circle cx="285.7" cy="165" r="7" fill="#facc15" filter="url(#neonBloom)" />
    <circle cx="0" cy="330" r="7" fill="#f43f5e" filter="url(#neonBloom)" />
    <circle cx="-285.7" cy="165" r="7" fill="#f43f5e" filter="url(#neonBloom)" />
    <circle cx="-285.7" cy="-165" r="7" fill="#38bdf8" filter="url(#neonBloom)" />
  </g>

  <!-- BMS Circuit Conduits & Telemetry Nodes -->
  <g opacity="0.65" stroke-linecap="round">
    <!-- Horizontal & Diagonal Conduits -->
    <path d="M 120 400 L 260 400 L 310 450" fill="none" stroke="#06b6d4" stroke-width="2" />
    <path d="M 680 400 L 540 400 L 490 350" fill="none" stroke="#f43f5e" stroke-width="2" />
    <path d="M 400 120 L 400 240 L 440 280" fill="none" stroke="#facc15" stroke-width="2" />
    <path d="M 400 680 L 400 560 L 360 520" fill="none" stroke="#38bdf8" stroke-width="2" />

    <circle cx="260" cy="400" r="4" fill="#38bdf8" />
    <circle cx="540" cy="400" r="4" fill="#f43f5e" />
    <circle cx="400" cy="240" r="4" fill="#facc15" />
    <circle cx="400" cy="560" r="4" fill="#38bdf8" />
  </g>

  <!-- Central Holographic Energy Core Emblem: Monogram "AK" -->
  <g id="akMonogram" transform="translate(400, 400)">
    <!-- Ambient Core Backlight -->
    <circle cx="0" cy="0" r="160" fill="url(#centerBurst)" filter="url(#neonBloom)" opacity="0.8" />

    <!-- Inner Core Shield -->
    <circle cx="0" cy="0" r="150" fill="#070b14" stroke="url(#titaniumSheen)" stroke-width="3" />

    <!-- Radial Sector Tech Segments -->
    <path d="M 0 -148 A 148 148 0 0 1 128 -74" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#intenseGlow)" />
    <path d="M 148 0 A 148 148 0 0 1 74 128" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" filter="url(#intenseGlow)" />
    <path d="M -128 74 A 148 148 0 0 1 -148 0" fill="none" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" filter="url(#intenseGlow)" />

    <!-- ==================== LETTER "A" ==================== -->
    <!-- Left Leg of 'A' -->
    <polygon points="-125,100 -80,-90 -45,-90 -85,100" fill="url(#cyberCyan)" filter="url(#intenseGlow)" />
    <polygon points="-125,100 -80,-90 -68,-90 -105,100" fill="#ffffff" opacity="0.5" />

    <!-- Right Leg of 'A' / Shared Spine -->
    <polygon points="-45,-90 -10,-90 35,100 -5,100" fill="url(#cyberGold)" />
    <polygon points="-30,-90 -10,-90 20,100 0,100" fill="#ffffff" opacity="0.3" />

    <!-- Crossbar of 'A' with Glowing Circuit Trace -->
    <polygon points="-96,30 18,30 24,52 -90,52" fill="url(#cyberCyan)" />
    <line x1="-85" y1="41" x2="10" y2="41" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Peak Diamond Crown of 'A' -->
    <polygon points="-62.5,-90 -45,-125 -27.5,-90 -45,-75" fill="#facc15" filter="url(#neonBloom)" />
    <circle cx="-45" cy="-95" r="4" fill="#ffffff" />

    <!-- ==================== LETTER "K" ==================== -->
    <!-- Vertical Spine of 'K' -->
    <polygon points="10,-85 45,-85 45,95 10,95" fill="url(#cyberGold)" />
    <polygon points="10,-85 24,-85 24,95 10,95" fill="#ffffff" opacity="0.45" />

    <!-- Upper Arm of 'K' with Cyber Chevron -->
    <polygon points="45,-10 115,-85 152,-85 75,10" fill="url(#cyberRose)" filter="url(#intenseGlow)" />
    <polygon points="115,-85 152,-85 138,-65 105,-65" fill="#ffffff" opacity="0.6" />

    <!-- Lower Leg of 'K' with Dynamic Flare -->
    <polygon points="62,-2 135,95 98,95 35,20" fill="url(#cyberCyan)" filter="url(#intenseGlow)" />
    <polygon points="98,95 135,95 118,75 85,75" fill="#ffffff" opacity="0.6" />

    <!-- Center Junction Fusion Star -->
    <polygon points="50,5 57,-4 65,3 58,11" fill="#ffffff" filter="url(#neonBloom)" />
  </g>

  <!-- Telemetry HUD Typography & Readouts -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#94a3b8" opacity="0.85">
    <!-- Top Arc Header -->
    <text x="400" y="70" text-anchor="middle" fill="#38bdf8">SYS.CORE // ANISH KUMAR</text>
    <text x="400" y="745" text-anchor="middle" fill="#facc15">DEV • BMS ARCHITECTURE • 2026</text>

    <!-- Side Coordinates -->
    <text x="65" y="405" text-anchor="start" font-size="9" fill="#06b6d4" opacity="0.7">LAT: 28.61° N</text>
    <text x="735" y="405" text-anchor="end" font-size="9" fill="#f43f5e" opacity="0.7">LON: 77.20° E</text>
  </g>

  <!-- Glowing Corner Tech Brackets -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 40 80 L 40 40 L 80 40" />
    <path d="M 760 80 L 760 40 L 720 40" />
    <path d="M 40 720 L 40 760 L 80 760" stroke="#f43f5e" />
    <path d="M 760 720 L 760 760 L 720 760" stroke="#facc15" />
  </g>
</svg>
